services:
  yt-2-mp4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-2-mp4
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOWNLOADS_DIR=/tmp/downloads
    volumes:
      # Optional: persist downloads to host for debugging
      - ./downloads:/tmp/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
